services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
      READ_DATABASE_URL_FILE: /run/secrets/read_database_url
      REPUTATION_DATABASE_URL_FILE: /run/secrets/reputation_database_url
      # Maintenance remains disabled until explicitly configured by the operator.
      ENABLE_EXTERNAL_ENRICHMENT: ${ENABLE_EXTERNAL_ENRICHMENT:-false}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    secrets:
      - auth_database_url
      - read_database_url
      - reputation_database_url
    read_only: true
    tmpfs:
      - /tmp
    # Note: no-new-privileges is deliberately omitted to prevent AppArmor EPERM
    # collisions on Ubuntu hosts with AppArmor / Docker snap during entrypoint exec.
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
secrets:
  auth_database_url:
    file: ${IP_INTEL_SECRET_DIR:-.runtime/secrets}/auth-database-url
  read_database_url:
    file: ${IP_INTEL_SECRET_DIR:-.runtime/secrets}/read-database-url
  reputation_database_url:
    file: ${IP_INTEL_SECRET_DIR:-.runtime/secrets}/reputation-database-url
